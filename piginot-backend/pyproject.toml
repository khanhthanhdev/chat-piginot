[project]
name = "piginot-backend"
version = "1.0.0"
description = "LGO indoor-airflow inference service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "matplotlib==3.11.0",
    "neuraloperator==2.0.0",
    "numpy==2.4.4",
    "pandas==3.0.3",
    "scipy==1.18.0",
    "torch==2.13.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
